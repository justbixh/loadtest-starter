gatling {
  core {
    encoding = "utf-8"

    # Leave blank to pick the simulation class interactively at runtime,
    # or set explicitly (e.g. "simulations.TopupSimulation") to skip the prompt
    # run as `./mvnw gatling:test`
    # if you skip this, pass the class in the commandline like this `./mvnw gatling:test -Dgatling.simulationClass=simulations.TopupSimulation`
    simulationClass = ""

    directory {
      results = "target/gatling"
    }
  }

  charting {
    indicators {
      # Response-time bucket boundaries (ms) used in the "Response Time Ranges" chart
      lowerBound = 100
      higherBound = 1000

      # Percentiles shown in the report's summary stats table
      percentile1 = 50
      percentile3 = 95
      percentile4 = 99
    }
  }

  http {
    # Disable sending anonymous usage stats to Gatling's Google Analytics
    enableGA = false

    # Max time (ms) to wait for the full request/response round trip before timing out
    requestTimeout = 30000

    # How long (ms) an idle pooled connection is kept open before being closed
    pooledConnectionIdleTimeout = 60000

    # Max time (ms) to wait for a read on the socket before timing out
    readTimeout = 30000
  }

  # SSL configuration
  ssl {
    # Use OpenSSL (via netty-tcnative) instead of the JDK's SSL implementation for performance
    useOpenSsl = true

    useInsecureTrustManager = false
  }

  data {
    # Where Gatling writes live/aggregated stats during the run.
    # console = live terminal output, file = simulation.log for the HTML report
    writers = [console, file]

    console {
      light = false        # false = full stats table in console; true = compact one-liner
      writePeriod = 5       # seconds between console stat refreshes
    }

    file {
      bufferSize = 8192     # write buffer size (bytes) for simulation.log
    }
  }
}
